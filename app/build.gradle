plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.geely.carsurfacelab'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.geely.carsurfacelab'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.car.app:app:1.7.0'
}
