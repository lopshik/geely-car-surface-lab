plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.geely.carsurfacelab'
    compileSdk 35

    defaultConfig {
        // v0.1 was signed with an ephemeral CI debug key. Keep it intact and install
        // the diagnostic revision side-by-side; do not require uninstalling it.
        applicationId 'dev.geely.carvideo.preview082'
        minSdk 26
        targetSdk 35
        versionCode 82
        versionName '0.8.2-preview'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.car.app:app:1.7.0'
    // Official Android Auto projected implementation, previously missing.
    implementation 'androidx.car.app:app-projected:1.7.0'
}
